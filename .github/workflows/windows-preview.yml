name: Package Windows synthetic preview
on:
  push:
    branches:
      - main
      - design/opencode-r1-08-desktop-ui-modernization
    paths:
      - 'scripts/Package-BIMSpend.ps1'
      - 'scripts/preview_entry.py'
      - 'scripts/Smoke-Packaged-BIMSpend.ps1'
      - 'src/**'
      - 'data/synthetic/**'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and pinned packager
        run: python -m pip install -e . pyinstaller==6.16.0 pyautogui==0.9.54 Pillow==10.3.0
      - name: Build executable folder
        shell: pwsh
        run: .\scripts\Package-BIMSpend.ps1
      - name: Smoke test packaged executable with synthetic data
        shell: pwsh
        run: .\scripts\Smoke-Packaged-BIMSpend.ps1
      - name: Capture screenshots of packaged preview
        shell: pwsh
        run: .\scripts\Capture-Preview-Screenshots.ps1
        continue-on-error: true
      - name: Upload synthetic preview folder
        uses: actions/upload-artifact@v4
        with:
          name: BIMSpend-Windows-Synthetic-Preview
          path: .preview/dist/BIMSpend/
          if-no-files-found: error
      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: BIMSpend-Windows-Screenshots
          path: .preview/screenshots/
          if-no-files-found: warn
