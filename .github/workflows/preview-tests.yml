name: Desktop preview tests
on:
  push:
    branches:
      - main
      - work/bimspend-build-integration
      - build/bimspend-p0-foundation
      - build/bimspend-p0-auth-session
      - build/bimspend-p0-security-hardening
  workflow_dispatch:

jobs:
  synthetic-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile and test synthetic workflows
        shell: pwsh
        run: .\scripts\Test-BIMSpend.ps1
