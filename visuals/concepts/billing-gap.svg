<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#0b1730"/><text x="48" y="66" fill="white" font-family="Arial" font-size="32" font-weight="bold">Actual time vs billed time | Synthetic example</text><rect x="70" y="115" width="960" height="115" rx="18" fill="#183457" stroke="#3a6995" stroke-width="2"/><text x="92" y="160" fill="#ffffff" font-family="Arial" font-size="23" font-weight="bold">Actual time: 12 hours</text><text x="92" y="196" fill="#b8cce0" font-family="Arial" font-size="17">At A$110 standard charge-out rate = A$1,320 reference value</text><rect x="70" y="280" width="960" height="115" rx="18" fill="#183457" stroke="#3a6995" stroke-width="2"/><text x="92" y="325" fill="#ffffff" font-family="Arial" font-size="23" font-weight="bold">Billed time: 8 hours</text><text x="92" y="361" fill="#b8cce0" font-family="Arial" font-size="17">Invoice A$880; 66.7% of actual hours billed</text><rect x="70" y="445" width="960" height="115" rx="18" fill="#183457" stroke="#3a6995" stroke-width="2"/><text x="92" y="490" fill="#ffffff" font-family="Arial" font-size="23" font-weight="bold">Difference: 4 hours / A$440</text><text x="92" y="526" fill="#b8cce0" font-family="Arial" font-size="17">Unbilled reference value is not necessarily financial loss</text></svg>