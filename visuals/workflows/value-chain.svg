<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#0b1730"/><text x="48" y="66" fill="white" font-family="Arial" font-size="32" font-weight="bold">From tracked work to better estimates</text><rect x="180" y="105" width="740" height="88" rx="18" fill="#183457" stroke="#3a6995" stroke-width="2"/><text x="202" y="150" fill="#ffffff" font-family="Arial" font-size="23" font-weight="bold">1. Observe actual work</text><text x="202" y="186" fill="#b8cce0" font-family="Arial" font-size="17">Project / model / user / session evidence</text><rect x="180" y="222" width="740" height="88" rx="18" fill="#183457" stroke="#3a6995" stroke-width="2"/><text x="202" y="267" fill="#ffffff" font-family="Arial" font-size="23" font-weight="bold">2. Calculate cost and realization</text><text x="202" y="303" fill="#b8cce0" font-family="Arial" font-size="17">Actual hours vs billed hours vs loaded labor cost</text><rect x="180" y="339" width="740" height="88" rx="18" fill="#183457" stroke="#3a6995" stroke-width="2"/><text x="202" y="384" fill="#ffffff" font-family="Arial" font-size="23" font-weight="bold">3. Build historical comparisons</text><text x="202" y="420" fill="#b8cce0" font-family="Arial" font-size="17">Scope, complexity, phase, deliverables</text><rect x="180" y="456" width="740" height="88" rx="18" fill="#183457" stroke="#3a6995" stroke-width="2"/><text x="202" y="501" fill="#ffffff" font-family="Arial" font-size="23" font-weight="bold">4. Estimate new work</text><text x="202" y="537" fill="#b8cce0" font-family="Arial" font-size="17">Range and assumptions, not false precision</text></svg>